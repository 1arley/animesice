name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # ESLint CLI direto — `next lint` está deprecated (quebra no Next 16).
      - run: npx eslint app src --ext .ts,.tsx
      # Build com a API de produção (as páginas com fallback não quebram o
      # build se a API estiver fora — o serverFetchJson tem fallbacks).
      # NEXT_PUBLIC_API_URL precisa do sufixo /api (global prefix do backend)
      # — api.ts normaliza mesmo sem ele, mas o build de CI testa o valor real.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.animesice.app/api
          INCLUDE_LOCAL_API: "0"
      - run: npm run check:chunk-recovery

  e2e:
    name: Playwright e2e (chromium + mobile)
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O webServer do playwright.config.ts sobe o mock-backend (porta 3001) e
      # builda o Next com INCLUDE_LOCAL_API=1 antes de startar.
      - run: npx playwright test
        env:
          CI: "true"
