# Release automation based on Conventional Commits.
# Triggers only after CI completes successfully (workflow_run), which avoids
# releasing a red tree. The release script reads conventional commits since
# the latest v* tag and creates a GitHub Release when a bump is recommended.
name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write # create tags/releases + commit changelog/version bump

jobs:
  release:
    name: Conventional release
    runs-on: ubuntu-latest
    # Only run if CI succeeded. Prevents releases from failed builds.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Checkout the exact commit that CI ran against, with full history so
      # the release script can compute the conventional-commits range.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # The release script configures git auth with the short-lived token.
          persist-credentials: false

      - name: Setup Node.js & dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run release script
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Skipping release because main advanced after CI ran."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="$(git tag --list 'v*' | sort -V)"
          npm run release
          git fetch --tags
          after="$(git tag --list 'v*' | sort -V)"
          tag="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Announce release in Discord
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Set the DISCORD_WEBHOOK_URL repository secret to enable Discord announcements."
            exit 0
          fi

          if ! payload="$(gh release view "$RELEASE_TAG" --json name,body,url | jq \
            --arg tag "$RELEASE_TAG" \
            --arg component "Frontend" '
              . as $release |
              ($release.body // "Veja o release para os detalhes desta versão.") as $notes |
              {
                content: ("🚀 **Novidades do AnimeSice** — versão `" + $tag + "`"),
                embeds: [{
                  title: ($release.name // ("Versão " + $tag)),
                  url: $release.url,
                  description: (if ($notes | length) > 3700 then $notes[:3600] + "\n\n… notas completas no GitHub." else $notes end),
                  color: 5793266,
                  footer: {text: ("AnimeSice • " + $component + " • Notas oficiais")}
                }]
              }
            ')"; then
            echo "::warning::Could not prepare the Discord announcement for $RELEASE_TAG."
            exit 0
          fi

          if ! curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            "$DISCORD_WEBHOOK_URL"; then
            echo "::warning::Discord announcement failed for $RELEASE_TAG; the release remains successful."
          fi
