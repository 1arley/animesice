name: Build & Push Docker Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine API URL
        id: api
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=https://api.animesice.app/api" >> $GITHUB_OUTPUT
          else
            echo "url=https://api.dev.animesice.app/api" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:${{ steps.tag.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api.outputs.url }}
            NEXT_PUBLIC_SITE_URL=https://${{ github.ref_name == 'main' && 'animesice.app' || 'dev.animesice.app' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
