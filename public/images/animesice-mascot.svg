<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="250" height="250">
  <!-- Fundo escuro semelhante ao da imagem original para destacar o contraste -->
  <rect width="200" height="200" fill="#202225" />
  
  <g transform="translate(100, 100)">
    <!-- Cristal Traseiro Esquerdo -->
    <polygon points="-25,-20 -55,-60 -40,10 -15,30" fill="#00838F"/>
    <polygon points="-55,-60 -40,10 -35,-15" fill="#00B8D4"/>
    
    <!-- Cristal Traseiro Direito -->
    <polygon points="25,-10 60,-50 45,20 15,40" fill="#0091EA"/>
    <polygon points="25,-10 60,-50 40,0" fill="#40C4FF"/>

    <!-- Cristal Central (Face Esquerda) -->
    <polygon points="0,-80 -30,15 0,70" fill="#00E5FF"/>
    
    <!-- Cristal Central (Face Direita) -->
    <polygon points="0,-80 30,15 0,70" fill="#84FFFF"/>
    
    <!-- Reflexo/Brilho Principal no Cristal Central -->
    <polygon points="0,-80 -8,15 0,70" fill="#E0F7FA"/>
    
    <!-- Fragmento Lateral Esquerdo -->
    <polygon points="-30,15 -60,30 -45,60 -15,50" fill="#00B0FF"/>
    <polygon points="-30,15 -60,30 -40,35" fill="#84FFFF"/>
    
    <!-- Fragmento Lateral Direito -->
    <polygon points="30,15 65,20 40,70 10,60" fill="#0091EA"/>
    <polygon points="30,15 65,20 45,35" fill="#E0F7FA"/>
  </g>
</svg>
