<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Drift Loop Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080C12;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    /* Background SVG fills the viewport */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Simulated UI overlay to test readability */
    .ui-overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 600;
      color: #38E8DA;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 32px;
    }

    .nav a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
      transition: color 0.3s ease;
    }

    .nav a:hover {
      color: #38E8DA;
    }

    .center-content {
      text-align: center;
      color: rgba(255, 255, 255, 0.15);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .bottom-bar span {
      color: rgba(255, 255, 255, 0.25);
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    /* Aspect ratio indicator */
    .aspect-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(56, 232, 218, 0.1);
      border: 1px solid rgba(56, 232, 218, 0.2);
      color: #38E8DA;
      font-size: 10px;
      padding: 4px 10px;
      letter-spacing: 2px;
      z-index: 10;
      font-family: 'Inter', monospace;
    }
  </style>
</head>

<body>
  <div class="aspect-badge">16:9 · 1080p · LOOP</div>

  <div class="bg-layer">
    <img src="bg-drift-loop.svg" alt="Animated Background">
  </div>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="logo">AnimesIce</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Catálogo</a>
        <a href="#">Lançamentos</a>
        <a href="#">Gêneros</a>
      </nav>
    </div>

    <div class="center-content">
      — animated shards drift zone —
    </div>

    <div class="bottom-bar">
      <span>© 2026 AnimesIce</span>
      <span>·</span>
      <span>Termos</span>
      <span>·</span>
      <span>Privacidade</span>
    </div>
  </div>
</body>

</html>
