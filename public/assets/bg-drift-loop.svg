</g>

<!-- ============================================================
     SIGNAL SCAN LINES — subtle horizontal pulses
     ============================================================ -->

<g id="sig-01">
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#60F6E9" stroke-opacity="0.12" stroke-width="1"/>
</g>

<g id="sig-02">
  <line x1="0" y1="510" x2="1920" y2="510" stroke="#60F6E9" stroke-opacity="0.08" stroke-width="1"/>
</g>

<g id="sig-03">
