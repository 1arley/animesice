<style>
/* Layout: palco WebGL em tela cheia; HUD fino nos cantos; timeline arrastável na base.
   Visual deliberadamente escuro e único (holograma), sem alternância de tema. */
:root {
  --bg: #02070b;
  --ink: #d3f1fc;
  --ink-dim: #6d95a9;
  --line: #9fdcf5;
  --hair: rgba(159, 220, 245, 0.22);
  --panel: rgba(5, 17, 25, 0.62);
  --warm: #ffe0b0;
  --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud { position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { top: env(safe-area-inset-top, 0px); padding-top: 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.bottom { bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

.id { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.id b { font-weight: 500; font-size: 13px; color: var(--ink); letter-spacing: .22em; }
.id span { color: var(--ink-dim); }

.status { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; border: 1px solid var(--hair); background: var(--panel);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; min-width: 168px; }
.status i { width: 7px; height: 7px; background: var(--line); transform: rotate(45deg); box-shadow: 0 0 10px var(--line); flex: none; transition: background .2s, box-shadow .2s; }
.status[data-s="flash"] i { background: #fff; box-shadow: 0 0 14px #fff, 0 0 28px var(--warm); }
.status[data-s="auth"] i { animation: blink .22s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }

.bar { display: flex; align-items: center; gap: 14px; pointer-events: auto; max-width: 880px; margin: 0 auto;
  padding: 10px 14px; border: 1px solid var(--hair); background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; background: transparent; color: var(--ink);
  border: 1px solid var(--hair); cursor: pointer; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--line); background: rgba(159, 220, 245, .08); }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }

.track { position: relative; flex: 1; min-width: 0; height: 34px; }
#scrub { -webkit-appearance: none; appearance: none; position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
#scrub::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(90deg, var(--line) var(--p, 0%), var(--hair) var(--p, 0%)); }
#scrub::-moz-range-track { height: 1px; background: var(--hair); }
#scrub::-moz-range-progress { height: 1px; background: var(--line); }
#scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; background: var(--ink); transform: rotate(45deg); box-shadow: 0 0 12px var(--line); border: 0; border-radius: 0; }
#scrub::-moz-range-thumb { width: 10px; height: 10px; background: var(--ink); border: 0; border-radius: 0; transform: rotate(45deg); box-shadow: 0 0 12px var(--line); }
.ticks { position: absolute; left: 0; right: 0; top: 14px; height: 20px; pointer-events: none; }
.ticks em { position: absolute; transform: translateX(-50%); font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
.ticks em::before { content: ""; display: block; width: 1px; height: 4px; margin: 0 auto 3px; background: var(--ink-dim); opacity: .6; }
.time { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.time b { font-weight: 500; color: var(--ink); }

.hint { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 10px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ink-dim); pointer-events: none; transition: opacity 1.2s; z-index: 2; }
.hint.off { opacity: 0; }

#fail { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 32px; color: var(--ink-dim); font-size: 13px; line-height: 1.6; z-index: 3; }

@media (max-width: 620px) {
  .ticks em { display: none; }
  .ticks i { position: absolute; top: 14px; width: 1px; height: 4px; background: var(--ink-dim); opacity: .6; }
  .track { height: 22px; }
  .time { min-width: 0; }
  .time .tot { display: none; }
  .status { min-width: 0; }
  .bar { gap: 10px; padding: 8px 10px; }
}
@media (min-width: 621px) { .ticks i { display: none; } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ───────────────────────── utilidades ───────────────────────── */
const T = 11, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x, c = 1.70158) => { const c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ───────────────────────── renderer ───────────────────────── */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fail').style.display = 'grid';
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 1);
stage.appendChild(renderer.domElement);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 99);
renderer.clippingPlanes = [clipPlane];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* paleta (cores lineares via THREE.Color) */
const C = {
  ice: new THREE.Color('#9fdcf5'),
  bright: new THREE.Color('#e6faff'),
  mid: new THREE.Color('#4a9ec2'),
  deep: new THREE.Color('#06172a'),
  teal: new THREE.Color('#0c5a78'),
  warm: new THREE.Color('#ffe0b0'),
};

/* ───────────────────────── linhas grossas ───────────────────────── */
const lineMats = [];
let dpr = Math.min(window.devicePixelRatio || 1, 2);
function mkLine(pos, o = {}) {
  const { color = C.ice, w = 1.4, op = 1, boost = 1.2, dashed = false, dashSize = .1, gapSize = .08, depthFunc, depthWrite = true, order = 3 } = o;
  const g = new LineSegmentsGeometry(); g.setPositions(pos);
  const m = new LineMaterial({ color: 0xffffff, linewidth: w, transparent: true, opacity: op, dashed, dashSize, gapSize, worldUnits: false });
  m.color.copy(color).multiplyScalar(boost);
  if (depthFunc !== undefined) m.depthFunc = depthFunc;
  m.depthWrite = depthWrite;
  m.userData.w = w; m.userData.base = op;
  lineMats.push(m);
  const l = new LineSegments2(g, m);
  if (dashed) l.computeLineDistances();
  l.renderOrder = order;
  return l;
}
const seg = (a, p, q) => a.push(p[0], p[1], p[2], q[0], q[1], q[2]);
function loop(a, pts) { for (let i = 0; i < pts.length; i++) seg(a, pts[i], pts[(i + 1) % pts.length]); }
function circlePts(r, n = 64, f = (x, y) => [x, y, 0]) { const a = []; for (let i = 0; i < n; i++) { const t = i / n * TAU; a.push(f(Math.cos(t) * r, Math.sin(t) * r)); } return a; }

/* ───────────────────────── shaders ───────────────────────── */
const fillVS = /* glsl */`
varying vec3 vLocal; varying vec3 vLN; varying vec3 vN; varying vec3 vView;
#include <clipping_planes_pars_vertex>
void main(){
  vLocal = position; vLN = normal;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vN = normalize(mat3(modelMatrix) * normal);
  vView = normalize(cameraPosition - wp.xyz);
  vec4 mvPosition = viewMatrix * wp;
  gl_Position = projectionMatrix * mvPosition;
  #include <clipping_planes_vertex>
}`;
const fillFS = /* glsl */`
uniform vec3 uColor; uniform vec3 uDeep; uniform float uTime; uniform float uAlpha; uniform float uFlash;
uniform float uOpen; uniform float uHeight; uniform float uGrid; uniform float uBand; uniform float uCharge;
varying vec3 vLocal; varying vec3 vLN; varying vec3 vN; varying vec3 vView;
#include <clipping_planes_pars_fragment>
float sq(float x){ return x * x; }
float grid(vec2 p, float s){ vec2 q = p / s; vec2 g = abs(fract(q - .5) - .5) / max(fwidth(q), vec2(1e-4)); return 1.0 - min(min(g.x, g.y), 1.0); }
void main(){
  #include <clipping_planes_fragment>
  vec3 n = normalize(vN); bool front = gl_FrontFacing; if(!front) n = -n;
  vec3 v = normalize(vView);
  float fres = pow(1.0 - clamp(abs(dot(n, v)), 0.0, 1.0), 2.2);
  vec3 a = abs(vLN); vec2 uv = a.x > .5 ? vLocal.zy : (a.y > .5 ? vLocal.xz : vLocal.xy);
  float g = grid(uv, 0.22) * uGrid;
  float yb = fract(uTime * (1.0/5.5)) * (uHeight + 1.2) - 0.6;
  float band = exp(-sq((vLocal.y - yb) * 4.5)) * uBand;
  float yb2 = fract(uTime * (1.0/5.5) + .5) * (uHeight + 1.2) - 0.6;
  band += exp(-sq((vLocal.y - yb2) * 9.0)) * uBand * .35;
  vec3 col = uDeep + uColor * (fres * .30 + g * .075 + band * .16);
  col += uColor * uCharge * (.03 + .12 * fres);
  if(!front){ col += uColor * uOpen * pow(clamp(1.0 - vLocal.y / uHeight, 0.0, 1.0), 2.0) * .45; }
  col += vec3(1.0, .93, .82) * uFlash * (.12 + .5 * fres);
  float alpha = clamp(uAlpha + fres * .2 + uFlash * .15, 0.0, 1.0);
  gl_FragColor = vec4(col, alpha);
}`;
function fillMat(extra = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: fillVS, fragmentShader: fillFS, transparent: true, depthWrite: false, side: THREE.DoubleSide, clipping: true,
    uniforms: {
      uColor: { value: C.ice.clone() }, uDeep: { value: C.deep.clone() }, uTime: { value: 0 }, uAlpha: { value: .72 }, uFlash: { value: 0 },
      uOpen: { value: 0 }, uHeight: { value: 1.2 }, uGrid: { value: 1 }, uBand: { value: 1 }, uCharge: { value: 0 }, ...extra
    }
  });
}

const floorMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uMaster: { value: 0 }, uGlow: { value: 0 }, uIce: { value: C.ice.clone() }, uTeal: { value: C.teal.clone() }, uP: { value: Array.from({ length: 6 }, () => new THREE.Vector2()) } },
  vertexShader: `varying vec2 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.); vP = w.xz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
  uniform float uTime, uMaster, uGlow; uniform vec3 uIce, uTeal; uniform vec2 uP[6]; varying vec2 vP;
  float ln(float d, float w){ float aa = fwidth(d) * 1.2 + 1e-4; return 1.0 - smoothstep(max(w - aa, 0.0), w + aa, abs(d)); }
  void main(){
    float r = length(vP); float ang = atan(vP.y, vP.x);
    float base = ln(r - 2.55, .011) * .95 + ln(r - 2.78, .005) * .55 + ln(r - 3.65, .005) * .35 + ln(r - 5.4, .004) * .22;
    float tk = fract((ang + uTime * ${(TAU / T).toFixed(5)}) * 36.0 / ${TAU.toFixed(5)});
    float ticks = step(.93, tk) * (1.0 - smoothstep(.025, .04, abs(r - 3.12)));
    float ang2 = ang - uTime * ${(TAU / T * 2).toFixed(5)};
    float arcs = step(.38, fract(ang2 * 5.0 / ${TAU.toFixed(5)})) * ln(r - 3.95, .012);
    vec2 gp = fract(vP / .55) - .5; float dots = 1.0 - smoothstep(.018, .045, length(gp));
    float dotFade = (1.0 - smoothstep(3.2, 7.2, r)) * smoothstep(2.3, 3.3, r);
    float glow = exp(-r * r * .32) * (.20 + uGlow * .9);
    float pulse = 0.0;
    for(int i = 0; i < 6; i++){ pulse += ln(r - uP[i].x, .035 + .012 * uP[i].x) * uP[i].y; }
    vec3 col = uIce * (base * .55 + ticks * .45 + arcs * .35 + dots * dotFade * .22 + pulse * .8) + uTeal * glow * .45;
    float edge = 1.0 - smoothstep(6.0, 9.0, r);
    gl_FragColor = vec4(col * uMaster * edge, 1.0);
  }`
});

const ringMat = () => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uR: { value: 1 }, uW: { value: .03 }, uA: { value: 0 }, uColor: { value: C.ice.clone().multiplyScalar(1.6) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: /* glsl */`
  uniform float uR, uW, uA; uniform vec3 uColor; varying vec2 vUv;
  float sq(float x){ return x * x; }
  void main(){
    float r = length((vUv - .5) * 8.0); float d = r - uR;
    float aa = fwidth(r) * 1.3 + 1e-4;
    float core = 1.0 - smoothstep(uW, uW + aa + .02, abs(d));
    float trail = step(d, 0.0) * exp(d * 3.2) * .22 * smoothstep(0.0, .4, uR);
    float halo = exp(-sq(d / (uW * 5.0))) * .35;
    float a = (core + trail + halo) * (1.0 - smoothstep(3.0, 4.0, r)) * uA;
    gl_FragColor = vec4(uColor * a, 1.0);
  }`
});

const beamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, clipping: true,
  uniforms: { uTime: { value: 0 }, uI: { value: 0 }, uColor: { value: C.ice.clone() } },
  vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  #include <clipping_planes_pars_vertex>
  void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.); vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - wp.xyz);
    vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
    #include <clipping_planes_vertex>
  }`,
  fragmentShader: /* glsl */`
  uniform float uTime, uI; uniform vec3 uColor; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  #include <clipping_planes_pars_fragment>
  void main(){
    #include <clipping_planes_fragment>
    float rim = pow(clamp(1.0 - abs(dot(normalize(vN), normalize(vV))), 0.0, 1.0), 1.5);
    float fall = pow(clamp(1.0 - vUv.y, 0.0, 1.0), 2.6) * smoothstep(0.0, .06, vUv.y);
    float st = .55 + .45 * sin(vUv.y * 38.0 - uTime * ${(TAU * 2 / 1).toFixed(3)} + vUv.x * 12.566);
    float a = fall * (.18 + rim * .9) * st * uI;
    gl_FragColor = vec4(uColor * a, 1.0);
  }`
});

const dustMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uScale: { value: 600 }, uMaster: { value: 0 }, uColor: { value: C.ice.clone() } },
  vertexShader: /* glsl */`
  attribute vec4 aSeed; uniform float uTime, uScale, uMaster; varying float vA;
  void main(){
    float ph = uTime / ${T.toFixed(1)};
    float k = aSeed.y, m = aSeed.z, s = aSeed.x;
    float f = fract(position.y + k * ph);
    vec3 p = vec3(position.x, f * 6.4 - 0.9, position.z);
    p.x += .22 * sin(${TAU.toFixed(5)} * m * ph + s * 6.28); p.z += .22 * cos(${TAU.toFixed(5)} * m * ph + s * 9.1);
    vec4 mv = viewMatrix * modelMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = max(1.2, aSeed.w * uScale / -mv.z);
    float tw = .55 + .45 * sin(${TAU.toFixed(5)} * 4.0 * ph + s * 30.0);
    vA = sin(3.14159 * f) * tw * uMaster;
  }`,
  fragmentShader: `uniform vec3 uColor; varying float vA; void main(){ float d = length(gl_PointCoord - .5); float a = 1.0 - smoothstep(0.0, .5, d); gl_FragColor = vec4(uColor * a * vA * 1.4, 1.0); }`
});

const pulseMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, clipping: true,
  uniforms: { uScale: { value: 600 }, uColor: { value: C.bright.clone().multiplyScalar(2.2) }, uI: { value: 1 } },
  vertexShader: `attribute float aA; uniform float uScale; varying float vA;
  #include <clipping_planes_pars_vertex>
  void main(){ vA = aA; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mvPosition; gl_PointSize = .11 * uScale / -mvPosition.z;
    #include <clipping_planes_vertex>
  }`,
  fragmentShader: `uniform vec3 uColor; uniform float uI; varying float vA;
  #include <clipping_planes_pars_fragment>
  void main(){
    #include <clipping_planes_fragment>
    float d = length(gl_PointCoord - .5); float a = pow(1.0 - smoothstep(0.0, .5, d), 1.6); gl_FragColor = vec4(uColor * a * vA * uI, 1.0); }`
});

/* sprite de brilho */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);

/* ───────────────────────── timeline ───────────────────────── */
const STOPS = [[0, 'Inicializando', 'idle', 0], [1.3, 'Travado', 'idle', 1], [3.3, 'Autenticando', 'auth', 0], [4.3, 'Destravado', 'flash', 1], [5.6, 'Aberto', 'open', 1], [8.3, 'Fechando', 'idle', 1], [9.7, 'Travado', 'idle', 0], [10.3, 'Encerrando', 'idle', 0]];

  { const tt = t - 6.4; if (tt > 0 && t < 8.35) { const s = (tt % 1.2) / 1.2; const a = Math.pow(1 - s, 1.5) * .7 * (1 - sstep(7.9, 8.35, t)); const m = ringPulse; m.visible = true; m.position.y = crystalState.y; m.material.uniforms.uR.value = .5 + eOut(s) * 2.8; m.material.uniforms.uA.value = a; m.material.uniforms.uW.value = .02; } else ringPulse.visible = false; }

  diaMat.color.copy(C.ice).lerp(new THREE.Color(.05, .1, .15), bWhite).multiplyScalar(1.5); diaMat.opacity = ba;

  const rimPt = (u, y) => { u = ((u % 1) + 1) % 1; const s = u * 4, side = Math.floor(s), f = s - side; const a = -hs + 2 * hs * f; return side === 0 ? [a, y, -hs] : side === 1 ? [hs, y, a] : side === 2 ? [-a, y, hs] : [-hs, y, -a]; };

  for (let i = 0; i < 4; i++) { const p = rimPt(t * sp + i / 4, .04); pulsePos.set(p, k * 3); pulseA[k++] = .9; }

  gyros.forEach(g => { const i = g.userData.i; g.rotation.set(i === 0 ? 1.15 : .35, t * .6 * g.userData.dir, i === 0 ? t * .5 : -1.0 + t * .3); g.material.dashOffset = -t * (.5 + i * .3); g.material.opacity = .7 * cglow; });
